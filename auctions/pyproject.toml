[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topbot"
version = "0.1.0"
description = "TOPDeck.ru watchlist bot: auction ending notifications and card prices"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
bot = ["aiogram>=3.13", "aiohttp-socks>=0.10"]
web = ["fastapi>=0.115", "uvicorn>=0.32", "jinja2>=3.1", "itsdangerous>=2.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["topbot*"]

[tool.setuptools.package-data]
topbot = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
