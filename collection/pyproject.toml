[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collectbot"
version = "0.1.0"
description = "MTG collection scanner bot: photos and videos in, collection CRUD out"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
bot = ["aiogram>=3.13"]

[tool.setuptools.packages.find]
include = ["collectbot*"]
